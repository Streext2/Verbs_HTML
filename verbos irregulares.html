<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbos Irregulares — Práctica</title>
<style>
  :root{
    --ink:#1f2a24;
    --paper:#f4efe4;
    --moss:#3f5b45;
    --moss-dark:#2c4130;
    --clay:#a8562f;
    --gold:#c99a3c;
    --line:#d8cdb4;
    --wrong:#a8402f;
    --ok:#3f5b45;
    font-family: 'Fraunces', Georgia, serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap');

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 42px;
    opacity:.35;
    pointer-events:none;
  }

  .book{
    position:relative;
    width:100%;
    max-width:640px;
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:2px;
    box-shadow: 0 1px 0 #fff inset, 0 20px 40px -20px rgba(30,20,10,.35);
    overflow:hidden;
  }

  header{
    padding:28px 32px 20px;
    border-bottom:2px solid var(--moss-dark);
    background: linear-gradient(180deg, #fbf7ec, #fffdf8);
  }
  header h1{
    margin:0 0 4px;
    font-weight:700;
    font-size:1.5rem;
    letter-spacing:.2px;
    color:var(--moss-dark);
  }
  header p{
    margin:0;
    font-family:'Space Mono', monospace;
    font-size:.75rem;
    color:#6b6252;
  }

  .progressbar{
    height:6px;
    background:#e9e1cc;
    position:relative;
  }
  .progressbar-fill{
    height:100%;
    background: linear-gradient(90deg, var(--moss), var(--gold));
    width:0%;
    transition: width .4s ease;
  }

  main{ padding:32px; }

  .verb-index{
    font-family:'Space Mono', monospace;
    font-size:.7rem;
    color:var(--clay);
    letter-spacing:.08em;
    margin-bottom:10px;
  }

  .prompt-card{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:26px;
  }
  .infinitive{
    font-size:2.1rem;
    font-weight:700;
    color:var(--moss-dark);
    line-height:1.1;
  }
  .spanish{
    font-style:italic;
    color:var(--clay);
    font-size:1.05rem;
    text-align:right;
    max-width:230px;
  }

  .fields{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
    margin-bottom:22px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{
    font-family:'Space Mono', monospace;
    font-size:.65rem;
    letter-spacing:.06em;
    color:#7a7261;
  }
  .field input{
    font-family:'Fraunces', Georgia, serif;
    font-size:1.05rem;
    padding:9px 10px;
    border:none;
    border-bottom:2px solid var(--line);
    background:transparent;
    color:var(--ink);
    outline:none;
    transition:border-color .2s;
  }
  .field input:focus{ border-color:var(--moss); }
  .field input.correct{ border-color:var(--ok); background:#f2f7f0; }
  .field input.incorrect{ border-color:var(--wrong); background:#fbf0ee; }

  .answer-reveal{
    font-family:'Space Mono', monospace;
    font-size:.78rem;
    color:var(--wrong);
    min-height:1.2em;
    margin:-10px 0 18px;
  }

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Space Mono', monospace;
    font-size:.8rem;
    letter-spacing:.03em;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    border-radius:2px;
    transition: transform .12s ease, background .2s;
  }
  button:active{ transform: translateY(1px); }
  .btn-check{ background:var(--moss); color:#fdf9ee; }
  .btn-check:hover{ background:var(--moss-dark); }
  .btn-skip{ background:transparent; color:var(--clay); border:1px solid var(--clay); }
  .btn-skip:hover{ background:#fbf0ea; }
  .btn-next{ background:var(--gold); color:#3a2c0f; display:none; }
  .btn-next:hover{ filter:brightness(.95); }

  .stats{
    margin-top:24px;
    padding-top:16px;
    border-top:1px dashed var(--line);
    display:flex;
    justify-content:space-between;
    font-family:'Space Mono', monospace;
    font-size:.7rem;
    color:#7a7261;
  }
  .stats span b{ color:var(--moss-dark); font-size:.85rem; }

  .end-screen{ text-align:center; padding:20px 0; }
  .end-screen h2{ color:var(--moss-dark); font-size:1.8rem; margin-bottom:6px;}
  .end-screen p{ font-family:'Space Mono', monospace; font-size:.8rem; color:#7a7261; margin-bottom:22px;}
  .end-score{ font-size:3rem; font-weight:700; color:var(--clay); margin:10px 0;}
  .restart{ background:var(--moss); color:#fdf9ee; padding:14px 28px; }

  .skipped-tag{
    display:inline-block;
    margin-left:10px;
    font-family:'Space Mono', monospace;
    font-size:.65rem;
    color:var(--gold);
    border:1px solid var(--gold);
    padding:2px 8px;
    border-radius:20px;
  }

  @media (max-width:520px){
    .fields{ grid-template-columns:1fr; }
    .prompt-card{ flex-direction:column; }
    .spanish{ text-align:left; max-width:none; }
    main{ padding:22px; }
    header{ padding:22px; }
  }
</style>
</head>
<body>

<div class="book">
  <header>
    <h1>Verbos irregulares</h1>
    <p id="subhead">50 verbos · escribe pasado simple y participio</p>
  </header>
  <div class="progressbar"><div class="progressbar-fill" id="progressFill"></div></div>

  <main id="quizArea">
    <div class="verb-index" id="verbIndex">VERBO 1 / 50</div>

    <div class="prompt-card">
      <div class="infinitive" id="infinitiveWord">—</div>
      <div class="spanish" id="spanishWord">—</div>
    </div>

    <div class="fields">
      <div class="field">
        <label for="inputBase">INFINITIVO</label>
        <input type="text" id="inputBase" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="inputPast">PASADO SIMPLE</label>
        <input type="text" id="inputPast" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="inputPP">PARTICIPIO</label>
        <input type="text" id="inputPP" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div class="answer-reveal" id="answerReveal"></div>

    <div class="controls">
      <button class="btn-check" id="btnCheck">Comprobar</button>
      <button class="btn-skip" id="btnSkip">Saltar verbo</button>
      <button class="btn-next" id="btnNext">Siguiente →</button>
    </div>

    <div class="stats">
      <span>Correctos: <b id="statCorrect">0</b></span>
      <span>Saltados pendientes: <b id="statSkipped">0</b></span>
      <span>Restantes: <b id="statRemaining">50</b></span>
    </div>
  </main>

  <main id="endArea" style="display:none;">
    <div class="end-screen">
      <h2>¡Terminaste los 50 verbos!</h2>
      <p>Aquí está tu resultado final</p>
      <div class="end-score" id="finalScore">0 / 50</div>
      <button class="restart" id="btnRestart">Empezar de nuevo</button>
    </div>
  </main>
</div>

<script>
const verbData = [
["abide","abode/abided","abode/abidden","aguantar / soportar a alguien"],
["alight","alit/alighted","alit/alighted","descender, bajar de tren, bus"],
["arise","arose","arisen","surgir, (a problem) alzarse"],
["awake","awoke","awoken","despertarse"],
["be","was/were","been","ser/estar"],
["bear","bore","born/borne","dar a luz, parir"],
["beat","beat","beaten","batir, golpear, latir"],
["become","became","become","llegar a ser, convertirse en"],
["begin","began","begun","empezar, comenzar"],
["behold","beheld","beheld","observar"],
["bend","bent","bent","doblar, inclinarse"],
["bet","bet","bet","apostar"],
["bid","bid","bid","ofertar en subastas, pujar, ofrecer"],
["beg","beg","beg","rogar"],
["bind","bound","bound","atar/sujetar"],
["bite","bit","bitten","morder"],
["bleed","bled","bled","sangrar"],
["blow","blew","blown","soplar"],
["break","broke","broken","romper"],
["breed","bred","bred","criar (animales)"],
["bring","brought","brought","traer"],
["broadcast","broadcast/broadcasted","broadcast/broadcasted","transmitir (un programa, por radio o televisión)"],
["build","built","built","construir"],
["burn","burnt","burnt","quemar"],
["burst","burst","burst","estallar"],
["buy","bought","bought","comprar"],
["cast","cast","cast","emitir, fundir hierro, moldear"],
["can","could","been able to","poder"],
["catch","caught","caught","atrapar"],
["choose","chose","chosen","elegir, escoger"],
["clap","clapt","clapt","aplaudir"],
["cling","clung","clung","agarrarse, aferrarse (to a hope)"],
["clothe","clad/clothed","clad/clothed","vestir, arropar"],
["come","came","come","venir"],
["cost","cost","cost","costar"],
["creep","crept","crept","deslizarse, arrastrarse"],
["cut","cut","cut","cortar"],
["deal","dealt","dealt","repartir, negociar, traficar"],
["dig","dug","dug","cavar"],
["dive","dived/dove","dived","bucear/zambullirse"],
["do","did","done","hacer (action)"],
["draw","drew","drawn","dibujar"],
["dream","dreamt","dreamt","soñar"],
["drink","drank","drunk","beber"],
["drive","drove","driven","conducir, manejar (carro)"],
["dwell","dwelt","dwelt","morar, vivir"],
["eat","ate","eaten","comer"],
["fall","fell","fallen","caer"],
["feed","fed","fed","alimentar"],
["feel","felt","felt","sentir"]
];

let queue = [];
let originalTotal = verbData.length;
let correctCount = 0;
let currentVerb = null;
let checked = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ');
}

// checks if user answer matches any of the accepted alt forms (separated by "/")
function isCorrect(userVal, correctVal){
  const options = correctVal.split('/').map(s=>normalize(s));
  return options.includes(normalize(userVal));
}

function init(){
  queue = shuffle(verbData).map(v => ({verb:v, skippedOnce:false}));
  correctCount = 0;
  document.getElementById('endArea').style.display='none';
  document.getElementById('quizArea').style.display='block';
  nextVerb();
}

function updateStats(){
  const remaining = queue.length;
  const skippedPending = queue.filter(q=>q.skippedOnce).length;
  document.getElementById('statCorrect').textContent = correctCount;
  document.getElementById('statSkipped').textContent = skippedPending;
  document.getElementById('statRemaining').textContent = remaining;
  const done = originalTotal - remaining + skippedPending*0; // progress based on unique verbs remaining
  const progressPct = Math.round(((originalTotal - remaining) / originalTotal) * 100);
  document.getElementById('progressFill').style.width = progressPct + '%';
}

function nextVerb(){
  checked = false;
  document.getElementById('answerReveal').textContent = '';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('btnCheck').style.display='inline-block';
  document.getElementById('btnSkip').style.display='inline-block';

  ['inputBase','inputPast','inputPP'].forEach(id=>{
    const el = document.getElementById(id);
    el.value='';
    el.classList.remove('correct','incorrect');
    el.disabled=false;
  });

  if(queue.length===0){
    showEnd();
    return;
  }

  // decide whether to interleave a skipped verb: if there are skipped items pending,
  // occasionally re-insert one instead of always going strictly in order.
  currentVerb = queue.shift();

  const idxLabel = (originalTotal - queue.length);
  document.getElementById('verbIndex').innerHTML =
    'VERBO ' + idxLabel + ' / ' + originalTotal +
    (currentVerb.skippedOnce ? '<span class="skipped-tag">Repesca</span>' : '');

  document.getElementById('infinitiveWord').textContent = currentVerb.verb[0];
  document.getElementById('spanishWord').textContent = currentVerb.verb[3];
  document.getElementById('inputBase').focus();
  updateStats();
}

function checkAnswer(){
  if(checked) return;
  checked = true;

  const [base, past, pp, spanish] = currentVerb.verb;
  const userBase = document.getElementById('inputBase').value;
  const userPast = document.getElementById('inputPast').value;
  const userPP = document.getElementById('inputPP').value;

  const baseOk = isCorrect(userBase, base);
  const pastOk = isCorrect(userPast, past);
  const ppOk = isCorrect(userPP, pp);

  markField('inputBase', baseOk);
  markField('inputPast', pastOk);
  markField('inputPP', ppOk);

  if(baseOk && pastOk && ppOk){
    correctCount++;
    document.getElementById('answerReveal').textContent = '';
  } else {
    document.getElementById('answerReveal').textContent =
      'Correcto: ' + base + ' — ' + past + ' — ' + pp;
  }

  document.getElementById('btnCheck').style.display='none';
  document.getElementById('btnSkip').style.display='none';
  document.getElementById('btnNext').style.display='inline-block';
  updateStats();
}

function markField(id, ok){
  const el = document.getElementById(id);
  el.classList.add(ok ? 'correct' : 'incorrect');
  el.disabled = true;
}

function skipVerb(){
  if(checked) return;
  // requeue this verb further into the deck (not immediately next), mark skippedOnce
  currentVerb.skippedOnce = true;
  const insertPos = Math.min(queue.length, 3 + Math.floor(Math.random()*4)); // insert a few verbs later
  queue.splice(insertPos, 0, currentVerb);
  nextVerb();
}

function showEnd(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('endArea').style.display='block';
  document.getElementById('finalScore').textContent = correctCount + ' / ' + originalTotal;
}

document.getElementById('btnCheck').addEventListener('click', checkAnswer);
document.getElementById('btnSkip').addEventListener('click', skipVerb);
document.getElementById('btnNext').addEventListener('click', nextVerb);
document.getElementById('btnRestart').addEventListener('click', init);

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    if(!checked){
      checkAnswer();
    } else {
      nextVerb();
    }
  }
});

init();
</script>

</body>
</html>
